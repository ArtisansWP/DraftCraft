name: Sync Assets to WordPress.org

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-assets:
    name: Sync Assets to WordPress.org SVN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Subversion & Sync Assets
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq subversion
          mkdir -p /tmp/svn-assets
          svn co "https://plugins.svn.wordpress.org/draftcraft/assets" /tmp/svn-assets --non-interactive --trust-server-cert --no-auth-cache --username "$SVN_USERNAME" --password "$SVN_PASSWORD"
          cp -rf .wordpress-org/* /tmp/svn-assets/
          cd /tmp/svn-assets
          svn add --force * || true
          svn status
          svn commit -m "Update assets: banners and icons" --non-interactive --trust-server-cert --no-auth-cache --username "$SVN_USERNAME" --password "$SVN_PASSWORD"